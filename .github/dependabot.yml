version: 2

# Weekly and grouped. Ungrouped updates on a repository with this many React
# Native packages produce a dozen pull requests a week, all of which need the
# same iOS and Android builds run against them, and the Expo SDK pins most of
# the interesting versions anyway.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # The Expo SDK pins React, React Native, TypeScript and the test tooling to
    # versions that work together. Those move with a deliberate SDK upgrade,
    # never with a dependency bump, so only patch releases are offered here.
    # Everything else may move freely within its major version.
    ignore:
      - dependency-name: 'expo*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'jest-expo'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@react-native/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@react-native-community/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@react-navigation/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-test-renderer'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@testing-library/react-native'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jest'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-config-expo'
        update-types: ['version-update:semver-major']
      - dependency-name: '@react-native-async-storage/async-storage'
        update-types: ['version-update:semver-major']
    groups:
      expo:
        patterns:
          - expo
          - expo-*
          - '@expo/*'
          - jest-expo
      react-native:
        patterns:
          - react-native
          - react-native-*
          - '@react-native/*'
          - '@react-native-community/*'
          - '@react-navigation/*'
      development:
        dependency-type: development
        patterns:
          - '*'
        exclude-patterns:
          - jest-expo
      production:
        dependency-type: production
        patterns:
          - '*'
        exclude-patterns:
          - expo
          - expo-*
          - '@expo/*'
          - react-native
          - react-native-*
          - '@react-native/*'
          - '@react-native-community/*'
          - '@react-navigation/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'
