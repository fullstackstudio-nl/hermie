name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-commit-messages needs the branch history, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format

      - name: Unit tests
        run: npm test

      - name: App tests
        run: npm run test:app

      - name: Vendored sources are in sync
        run: npm run sync:hermes-shared:check

      - name: Icons match the design source
        run: npm run icons:check

      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: node scripts/check-no-trailers.mjs origin/${{ github.base_ref }}..HEAD

  # The native builds are the slow, expensive half: they run on demand and on
  # every release tag, not on every push. Nothing here signs anything — signing
  # and notarisation live in release.yml, behind secrets. See docs/release.md.
  android:
    name: Android debug build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm ci

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install
        working-directory: apps/hermie

      - name: Assemble
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/hermie/android

      - uses: actions/upload-artifact@v4
        with:
          name: hermie-android-debug-apk
          path: apps/hermie/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS simulator build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate the native project
        run: npx expo prebuild --platform ios --no-install
        working-directory: apps/hermie

      - name: Pods
        run: pod install
        working-directory: apps/hermie/ios

      - name: Build
        working-directory: apps/hermie/ios
        run: |
          xcodebuild \
            -workspace Hermie.xcworkspace \
            -scheme Hermie \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  macos:
    name: macOS build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Pods
        run: pod install
        working-directory: apps/hermie/macos

      # Release rather than Debug: only a Release build runs the phase that
      # bundles the JavaScript into the app, so a Debug product is not something
      # anyone can run without a Metro server.
      - name: Build
        working-directory: apps/hermie/macos
        run: |
          xcodebuild \
            -workspace Hermie.xcworkspace \
            -scheme Hermie-macOS \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # ditto, not zip: a .app is a bundle with symlinks and resource forks, and
      # a plain zip of one does not survive the round trip.
      - name: Package
        working-directory: apps/hermie/macos
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Release/Hermie.app \
            Hermie-macos-unsigned.zip

      - uses: actions/upload-artifact@v4
        with:
          name: hermie-macos-unsigned
          path: apps/hermie/macos/Hermie-macos-unsigned.zip
          if-no-files-found: error
