name: Release

# Everything here is the part of a release a machine can do on its own: build
# the one artefact that does not need a store account, and publish it against
# the tag with the CHANGELOG section for that version.
#
# The store halves — TestFlight, Play internal testing — are deliberately not
# here. They need an EAS project and credentials that belong to a person, and
# docs/release.md is the runbook for them. That now includes the Mac: since
# ADR-0011 it is the iOS build, which Apple offers on Apple Silicon Macs from
# the same App Store listing, so there is no downloadable .app to sign and
# notarise here any more.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm ci

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install
        working-directory: apps/hermie

      # A debug APK, and deliberately: a release APK would need an upload key
      # this workflow does not have, and an unsigned one cannot be installed at
      # all. The Play track is built by EAS — see docs/release.md.
      - name: Assemble
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/hermie/android

      - name: Name it after the tag
        run: |
          mkdir -p artifacts
          cp apps/hermie/android/app/build/outputs/apk/debug/app-debug.apk \
            "artifacts/Hermie-android-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: hermie-android
          path: artifacts/Hermie-android-debug.apk
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release notes from the CHANGELOG
        run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            artifacts/Hermie-android-debug.apk
