name: Release

# Everything here is the part of a release a machine can do on its own: build
# the two artefacts that do not need a store account, and publish them against
# the tag with the CHANGELOG section for that version.
#
# The store halves — TestFlight, Play internal testing — are deliberately not
# here. They need an EAS project and credentials that belong to a person, and
# docs/release.md is the runbook for them.
#
# Signing and notarisation run only when the secrets exist, so a fork of this
# repository can tag a release and get working unsigned artefacts out of it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # The `secrets` context cannot be read from a step's `if:`, so the answer
      # is computed once here and every later step keys off the output.
      - name: Look for signing secrets
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -n "$MACOS_CERTIFICATE_P12" ] && [ -n "$MACOS_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo 'sign=true' >> "$GITHUB_OUTPUT"
          else
            echo 'sign=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No Developer ID certificate in secrets — building unsigned.'
          fi
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo 'notarise=true' >> "$GITHUB_OUTPUT"
          else
            echo 'notarise=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No notarisation credentials in secrets — skipping notarisation.'
          fi

      - name: Import the Developer ID certificate
        if: steps.signing.outputs.sign == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db

      - name: Pods
        run: pod install
        working-directory: apps/hermie/macos

      - name: Build
        working-directory: apps/hermie/macos
        env:
          SIGN: ${{ steps.signing.outputs.sign }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$SIGN" = 'true' ]; then
            signing=(
              CODE_SIGNING_ALLOWED=YES
              CODE_SIGNING_REQUIRED=YES
              CODE_SIGN_STYLE=Manual
              CODE_SIGN_IDENTITY='Developer ID Application'
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
              OTHER_CODE_SIGN_FLAGS='--timestamp --options runtime'
            )
          else
            signing=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=)
          fi
          xcodebuild \
            -workspace Hermie.xcworkspace \
            -scheme Hermie-macOS \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            "${signing[@]}" \
            build

      # ditto, not zip: a .app is a bundle with symlinks, and notarytool rejects
      # an archive that did not preserve them.
      - name: Package
        working-directory: apps/hermie/macos
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Release/Hermie.app \
            Hermie-macos.zip

      - name: Notarise and staple
        if: steps.signing.outputs.sign == 'true' && steps.signing.outputs.notarise == 'true'
        working-directory: apps/hermie/macos
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool submit Hermie-macos.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          # The ticket is stapled to the app, so the zip has to be rebuilt from
          # the stapled bundle or the download still asks the user to trust it.
          xcrun stapler staple build/DerivedData/Build/Products/Release/Hermie.app
          rm -f Hermie-macos.zip
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Release/Hermie.app \
            Hermie-macos.zip

      - name: Say what came out
        working-directory: apps/hermie/macos
        run: |
          codesign --display --verbose=2 build/DerivedData/Build/Products/Release/Hermie.app 2>&1 || true
          spctl --assess --type execute --verbose build/DerivedData/Build/Products/Release/Hermie.app 2>&1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: hermie-macos
          path: apps/hermie/macos/Hermie-macos.zip
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm ci

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install
        working-directory: apps/hermie

      # A debug APK, and deliberately: a release APK would need an upload key
      # this workflow does not have, and an unsigned one cannot be installed at
      # all. The Play track is built by EAS — see docs/release.md.
      - name: Assemble
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/hermie/android

      - name: Name it after the tag
        run: |
          mkdir -p artifacts
          cp apps/hermie/android/app/build/outputs/apk/debug/app-debug.apk \
            "artifacts/Hermie-android-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: hermie-android
          path: artifacts/Hermie-android-debug.apk
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [macos, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release notes from the CHANGELOG
        run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            artifacts/Hermie-macos.zip \
            artifacts/Hermie-android-debug.apk
