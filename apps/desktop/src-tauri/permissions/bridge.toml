# The bridge's six commands, one permission each.
#
# **These are granted at run time, one capability per configured gateway.**
# There is no capability file for remote origins; `src/bridge.rs::grant` builds
# `remote-app:<id>` for every entry in the gateway list, with a `remote` pattern
# that is exactly that entry's origin and exactly the eight permission ids in
# `bridge::REMOTE_PERMISSIONS` — the six below plus `core:event:allow-listen`
# and `core:event:allow-unlisten`. A static pattern could only ever say "some
# remote origin", and the ACL is what decides whether the page asking is the
# app, so "some remote origin" would mean "any page the shell ever loads".
#
# Hand-written rather than autogenerated (`AppManifest::commands` in build.rs)
# because the descriptions are the security documentation a reviewer reads
# beside that grant, and because one permission per command is what makes
# `REMOTE_PERMISSIONS` a readable allow-list instead of a name that has to be
# looked up.
#
# There is deliberately NO `[default]` set here. A default permission would be
# a set every capability could pull in by accident; the bridge is granted by
# naming each command, and the six names below are the whole surface a remote
# origin can reach. Adding a seventh is a deliberate design change, not a
# routine edit.
#
# Defining any app permission at all switches Tauri's ACL on for this app's own
# commands (`RuntimeAuthority::has_app_manifest`), which means a LOCAL page —
# `connect.html`, `offline.html` — also needs a command named in its own
# capability before it can call one. That is the behaviour this file wants: the
# shell's pages get the local API they need and not the app's bridge.

[[permission]]
identifier = "allow-hermie-shell-info"
description = """
Read the shell's version, platform, bridge version and the active gateway's id
and name. The app's feature detection: an answer means the bridge is reachable
from this page.
"""
commands.allow = ["hermie_shell_info"]

[[permission]]
identifier = "allow-hermie-set-menu"
description = """
Rebuild the native Chats menu from the titles and chat names the page sends.
Writes nothing and reads nothing; the page's own strings are the source of
truth for the menu's wording.
"""
commands.allow = ["hermie_set_menu"]

[[permission]]
identifier = "allow-hermie-notify"
description = """
Raise one OS notification with a title, an optional body and an optional
`hermie://` link to emit back when it is clicked. The shell wraps the
notification plugin, so a remote page never holds that plugin's own permission.
"""
commands.allow = ["hermie_notify"]

[[permission]]
identifier = "allow-hermie-set-badge"
description = """
Set or clear the dock badge, taskbar overlay icon or tray tooltip count.
"""
commands.allow = ["hermie_set_badge"]

[[permission]]
identifier = "allow-hermie-open-gateways"
description = """
Show the shell's own gateway picker. Navigates the window to a local page; the
page cannot choose where.
"""
commands.allow = ["hermie_open_gateways"]

[[permission]]
identifier = "allow-hermie-close-handled"
description = """
Answer a `close` shortcut: whether the page closed a level of its own, so the
shell knows whether to hide the window instead.
"""
commands.allow = ["hermie_close_handled"]
