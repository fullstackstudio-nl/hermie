# Non-secret configuration shared by both example shapes in this directory.
#
# Copy this into your own manifests and edit the values — this is a worked
# example, not something to `kubectl apply` unmodified onto a real cluster.
# Anything that looks like a credential belongs in secret.example.yaml instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermie-config
data:
  # --- Hermie Web (packages/hermie-web) ---
  # See ../web/README.md#flags-and-environment for the full set. The gateway
  # URL differs between the two shapes in this directory and is set on the
  # Deployment itself, not here, so this ConfigMap is shared by both.
  HERMIE_PUBLIC_URL: 'https://hermie.example.com'
  HERMIE_HOST: '0.0.0.0'
  HERMIE_PORT: '9120'
  HERMIE_STATE_DIR: '/data'
  HERMIE_CACHE_MAX_MB: '64'
  # Gateway user ids that are administrators of /admin on every start,
  # enforced and protected from removal through the page itself — see
  # ../web/README.md#administration. A gateway user id is an OIDC `sub` or a
  # basic-auth username, exactly as /api/auth/me answers it — never an email
  # address, and not namespaced per provider.
  HERMIE_ADMINS: 'ada,grace'
  # Uncomment to refuse the gateway's own OIDC/SSO sign-in routes and hide
  # them from the app — see ../web/README.md#turning-sso-off. Left commented
  # out, OIDC stays on, which is the ordinary behaviour; uncomment only for a
  # deployment that wants password sign-in only, whatever the gateway offers.
  # HERMIE_OIDC: 'false'
  #
  # Hermie Web on its OWN domain next to the gateway's, with OIDC sign-in
  # finishing on Hermie Web's — needs the fullstackstudio-org gateway and its
  # dashboard.public_urls; see ../web/README.md#its-own-domain-with-the-forks-dashboardpublic_urls
  # and README.md#two-domains. Uncomment these four, point HERMIE_PUBLIC_URL and
  # HERMES_DASHBOARD_PUBLIC_URL above at the GATEWAY's own address
  # (https://hermes.example.com), and register both /auth/callback URLs at the
  # identity provider.
  # HERMIE_WEB_PUBLIC_URL: 'https://app.example.com'
  # HERMIE_PASS_HOST: 'true'
  # HERMES_DASHBOARD_PUBLIC_URLS: 'https://app.example.com'
  # Shape (b) only — the sidecar reaches the gateway over loopback, which it
  # trusts already. The Pod network Hermie Web connects from; never 0.0.0.0/0.
  # 10.42.0.0/16 is k3s's whole Pod network, i.e. every Pod on the cluster:
  # apply networkpolicy.yaml with it, so Hermie Web is the only Pod that can
  # reach port 9119 at all, and narrow the range where your cluster allows it.
  # HERMES_DASHBOARD_TRUSTED_PROXIES: '10.42.0.0/16'

  # --- Hermes gateway (ghcr.io/fullstackstudio-org/hermes-agent:main) ---
  # The full list, and what each does:
  # https://github.com/fullstackstudio-org/hermes-agent/blob/main/website/docs/user-guide/docker.md#configure-from-environment-variables
  # Starts the supervised dashboard — the part Hermie Web talks to.
  HERMES_DASHBOARD: '1'
  HERMES_DASHBOARD_PUBLIC_URL: 'https://hermie.example.com'
  HERMES_DASHBOARD_HOST: '0.0.0.0'
  HERMES_DASHBOARD_PORT: '9119'
  # auto | on | off: refuse cookie-authenticated writes from a browser Origin
  # the gateway does not list. auto is on with two or more public URLs.
  # HERMES_DASHBOARD_WRITE_ORIGIN_CHECK: 'auto'
  HERMES_PROFILES_MAX: '10'
  HERMIE_PLUGIN: 'true'
