# Shape (b), part 1: the Hermes gateway as its own Deployment and Service.
#
# Pair this with hermie-web-standalone.yaml, which points HERMIE_GATEWAY_URL
# at the Service this file creates rather than at 127.0.0.1.
#
# Apply configmap.yaml and a filled-in copy of secret.example.yaml first.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
spec:
  replicas: 1
  # A second replica would be a second gateway with its own `/opt/data` and
  # its own live-session state — not two copies of the same one. Scale this by
  # giving it more resources, not more replicas.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: hermes }
  template:
    metadata:
      labels: { app: hermes }
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: hermes
          image: ghcr.io/fullstackstudio-org/hermes-agent:main
          # The gateway, with the supervised dashboard alongside it
          # (HERMES_DASHBOARD=1 in configmap.yaml).
          args: ['gateway', 'run']
          ports:
            - containerPort: 9119
          envFrom:
            - configMapRef: { name: hermie-config }
            - secretRef: { name: hermie-secrets }
          # Unauthenticated, and the 0.0.0.0 bind accepts the Pod IP as Host.
          readinessProbe:
            httpGet: { path: /api/status, port: 9119 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/status, port: 9119 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: '250m', memory: '256Mi' }
            limits: { memory: '1Gi' }
          volumeMounts:
            - { name: hermes-data, mountPath: /opt/data }
          # No runAsNonRoot here: the image starts as root, remaps its `hermes`
          # user and fixes /opt/data's ownership, then drops privileges — so it
          # keeps exactly the capabilities those steps need, and no more.
          # KILL is the one that is easy to miss: root s6-supervise signals the
          # services, which run as another uid, and without it a restart does
          # nothing and a stop waits out the whole grace period — silently,
          # nothing logs it. UNTESTED on a cluster so far: verify these in the
          # first k3s deployment.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
              add: ['CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'SETUID', 'SETGID', 'KILL']
      volumes:
        - { name: hermes-data, persistentVolumeClaim: { claimName: hermes-data } }
---
apiVersion: v1
kind: Service
metadata:
  name: hermes
spec:
  selector: { app: hermes }
  ports:
    - { name: gateway, port: 9119, targetPort: 9119 }
