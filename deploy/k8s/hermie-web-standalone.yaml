# Shape (b), part 2: Hermie Web as its own Deployment and Service, pointing at
# the Hermes gateway's Service (hermes-standalone.yaml) by DNS name.
#
# Apply configmap.yaml and a filled-in copy of secret.example.yaml first, and
# hermes-standalone.yaml before this — the gateway URL below assumes its
# Service already exists in the same namespace.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermie-web-state
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermie-web
spec:
  replicas: 1
  # `--state-dir` holds the push watcher's cursor, the VAPID key pair and any
  # stored sign-in, on one ReadWriteOnce volume — a second replica would fight
  # the first over that file rather than share load. Scale this by giving it
  # more resources, not more replicas, unless you split push onto its own
  # single-replica Deployment and run the rest stateless with --state-dir
  # pointed at an empty, throwaway volume.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: hermie-web }
  template:
    metadata:
      labels: { app: hermie-web }
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: hermie-web
          image: ghcr.io/fullstackstudio-nl/hermie-web:latest
          # Pin this to a released version in anything you run more than
          # once — see ../web/README.md#docker.
          ports:
            - containerPort: 9120
          env:
            # The only line that differs from the sidecar shape: the gateway
            # is reached over the cluster's Service DNS, not loopback.
            - { name: HERMIE_GATEWAY_URL, value: 'http://hermes:9119' }
          envFrom:
            - configMapRef: { name: hermie-config }
            - secretRef: { name: hermie-secrets }
          readinessProbe:
            httpGet: { path: /healthz, port: 9120 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 9120 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: '50m', memory: '64Mi' }
            limits: { memory: '256Mi' }
          volumeMounts:
            - { name: hermie-web-state, mountPath: /data }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      volumes:
        - { name: hermie-web-state, persistentVolumeClaim: { claimName: hermie-web-state } }
---
apiVersion: v1
kind: Service
metadata:
  name: hermie-web
spec:
  selector: { app: hermie-web }
  ports:
    - { name: http, port: 80, targetPort: 9120 }
