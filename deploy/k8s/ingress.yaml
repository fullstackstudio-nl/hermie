# TLS termination in front of Hermie Web, for either shape in this directory.
#
# ../web/README.md#putting-tls-in-front explains why this matters beyond the
# usual "serve over https": Hermie Web builds the OIDC issuer, an invitation
# link and the service-login redirect out of X-Forwarded-Proto/-Host/-Port,
# and a proxy that strips the port or forwards plain http there silently
# breaks all three. On a hostname:port combination that is not :443, make sure
# whatever terminates TLS forwards the ORIGINAL host (with its port) and not a
# rewritten one.
#
# nginx-ingress and Traefik both set X-Forwarded-Proto correctly by default
# when they terminate TLS themselves, which covers the common case of serving
# on 443 with no extra port. The annotation below is only for nginx-ingress;
# Traefik's equivalent is an IngressRoute (or a Middleware) rather than an
# annotation on this v1 Ingress kind — see your ingress controller's own docs
# if you are running Hermie Web on a port other than 443 behind it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermie-web
  annotations:
    # nginx-ingress: forward the upgrade headers the WebSocket needs, and the
    # original Host so Hermie Web's addresses stay correct. Drop this
    # annotation entirely if your controller is not nginx-ingress.
    nginx.ingress.kubernetes.io/proxy-set-headers: 'hermie-web/proxy-headers'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
spec:
  ingressClassName: nginx
  tls:
    - hosts: ['hermie.example.com']
      secretName: hermie-web-tls
  rules:
    - host: hermie.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # The Service name differs between the two shapes: `hermie`
                # for sidecar.yaml, `hermie-web` for hermie-web-standalone.yaml.
                name: hermie-web
                port:
                  number: 80
---
# Referenced by the nginx.ingress.kubernetes.io/proxy-set-headers annotation
# above. nginx-ingress reads this as a ConfigMap of extra headers to add to
# the proxied request — the two upgrade headers the WebSocket needs (see
# ../web/README.md's nginx block for why REST can work while the socket never
# connects without them).
apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-headers
data:
  Upgrade: '$http_upgrade'
  Connection: 'upgrade'
