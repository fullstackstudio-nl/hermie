# Shape (b) only: let nothing but Hermie Web (and, if the gateway has its own
# public hostname, your ingress controller) reach the gateway's port 9119.
#
# Why this belongs next to HERMES_DASHBOARD_TRUSTED_PROXIES: a Pod's IP is not
# fixed, so the gateway can only trust a NETWORK, and the example range in
# configmap.yaml (10.42.0.0/16, k3s's default Pod CIDR) is every Pod on the
# cluster. Trusting a peer means believing its X-Forwarded-Proto/-Host, and
# with it which listed origin a sign-in finishes on. This policy narrows who
# can be that peer to the Pods that should be, so the wide range stops mattering.
# Narrow the range itself as well where your cluster allows it (a dedicated
# node pool or IP pool for these Pods).
#
# Needs a CNI that enforces NetworkPolicy (k3s's default flannel + its bundled
# network policy controller does; plain flannel elsewhere does not). Untested
# on a cluster so far — verify it in your first deployment. Kubelet probes come
# from the node and are not affected on the common CNIs, but check yours.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-only-from-hermie-web
spec:
  podSelector:
    matchLabels: { app: hermes }
  policyTypes: ['Ingress']
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: hermie-web }
        # Only if hermes.example.com has an Ingress of its own: the ingress
        # controller's namespace. kube-system covers k3s's bundled Traefik;
        # another controller (ingress-nginx, a separately installed Traefik)
        # runs in its own namespace, so select that one instead. Delete this
        # entry if the gateway is reached only through Hermie Web.
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: TCP, port: 9119 }
