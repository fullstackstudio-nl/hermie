# A TEMPLATE, not a Secret to apply. Every value below is a placeholder — fill
# them in (or generate this with `kubectl create secret generic ... --from-literal=...`,
# or your cluster's secret manager) and never commit the filled-in version.
#
# stringData is used here only because this is documentation meant to be read;
# Kubernetes stores it the same way it stores `data` (base64, not encrypted at
# rest unless your cluster enables that separately).
apiVersion: v1
kind: Secret
metadata:
  name: hermie-secrets
type: Opaque
stringData:
  # --- Hermes gateway (names: the fork's website/docs/user-guide/docker.md,
  # "Configure from environment variables") ---
  # Username/password sign-in. A precomputed hash, not the password: the
  # image also takes HERMES_DASHBOARD_BASIC_AUTH_PASSWORD and hashes it at
  # start, but a hash is the one that is safe to keep in a Secret. If both are
  # set, the hash wins.
  HERMES_DASHBOARD_BASIC_AUTH_USERNAME: 'admin'
  HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH: ''
  # The session-signing secret, at least 16 bytes: `openssl rand -base64 32`.
  HERMES_DASHBOARD_BASIC_AUTH_SECRET: ''
  # Or your own identity provider instead: issuer and client id together,
  # the secret only for a confidential client, scopes optional (must include
  # openid). Register <each public URL>/auth/callback at the provider.
  HERMES_DASHBOARD_OIDC_ISSUER: ''
  HERMES_DASHBOARD_OIDC_CLIENT_ID: ''
  HERMES_DASHBOARD_OIDC_CLIENT_SECRET: ''
  # HERMES_DASHBOARD_OIDC_SCOPES: 'openid profile email offline_access'
  # A provider key the gateway's bots call out to. Name and count depend on
  # which providers you configured; OPENROUTER_API_KEY is the one the brief
  # names as an example.
  OPENROUTER_API_KEY: ''

  # --- Hermie Web, only if you run --push against an ungated gateway ---
  # Leave unset (and drop it from the Deployment's env) on an OIDC-gated
  # gateway, where `hermie-web login` stores its own credential in the state
  # volume instead.
  HERMIE_GATEWAY_TOKEN: ''

  # --- Hermie Web, only for a gateway with no accounts to name in HERMIE_ADMINS ---
  # A hash `hermie-web hash-secret` produced, never the plaintext secret
  # itself — see ../web/README.md#administration. Generate it once, with
  # `read -s` rather than `echo`, so the secret never lands in shell history
  # or a process listing:
  #   read -s -p 'Secret: ' secret && printf '%s' "$secret" | hermie-web hash-secret; unset secret
  HERMIE_LOCAL_ADMIN_PASSWORD_HASH: ''
