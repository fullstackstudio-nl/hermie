# Shape (a): Hermie Web as a sidecar in the same Pod as the Hermes gateway.
#
# One Pod, one network namespace, so Hermie Web reaches the gateway on
# 127.0.0.1 — the same relationship as running both processes on one host.
# Only Hermie Web's port is exposed; the gateway's 9119 never leaves the Pod,
# which is the tightest version of "authenticates nobody, so nothing else
# should reach it directly" that a self-hoster's own host already recommends.
#
# Apply configmap.yaml and a filled-in copy of secret.example.yaml first.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermie-web-state
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermie
spec:
  replicas: 1
  # More than one replica means more than one gateway, each with its own
  # `/opt/data` — this shape assumes a single Hermes instance and a
  # ReadWriteOnce volume, so it does not scale horizontally as written.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: hermie }
  template:
    metadata:
      labels: { app: hermie }
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: hermes
          image: ghcr.io/fullstackstudio-org/hermes-agent:main
          # Pin this to a tag once one exists (see ../web/README.md's note on
          # `latest` vs. a version tag for the same reasoning on Hermie Web).
          ports:
            - containerPort: 9119
          envFrom:
            - configMapRef: { name: hermie-config }
            - secretRef: { name: hermie-secrets }
          # The Hermes image's readiness surface is not something this
          # repository owns, so this is a plain TCP check rather than an
          # `httpGet` on a path we cannot promise stays unauthenticated (a
          # kubelet probe hits the Pod IP, not `dashboard.public_url`, and the
          # gateway's Host/Origin guard is exactly what would reject that).
          # Swap for `httpGet: /api/status` once you have confirmed it answers
          # your gateway's guard from inside the cluster.
          readinessProbe:
            tcpSocket: { port: 9119 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 9119 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: '250m', memory: '256Mi' }
            limits: { memory: '1Gi' }
          volumeMounts:
            - { name: hermes-data, mountPath: /opt/data }
          securityContext:
            runAsNonRoot: true
        - name: hermie-web
          image: ghcr.io/fullstackstudio-org/hermie-web:latest
          # Pin this to a released version in anything you run more than
          # once — see ../web/README.md#docker.
          ports:
            - containerPort: 9120
          env:
            # The whole point of this file: every setting below is an
            # environment variable, so nothing here overrides the image's
            # `args`. Reaching the gateway over loopback is what makes this a
            # sidecar rather than shape (b).
            - { name: HERMIE_GATEWAY_URL, value: 'http://127.0.0.1:9119' }
          envFrom:
            - configMapRef: { name: hermie-config }
            - secretRef: { name: hermie-secrets }
          readinessProbe:
            httpGet: { path: /healthz, port: 9120 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 9120 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: '50m', memory: '64Mi' }
            limits: { memory: '256Mi' }
          volumeMounts:
            - { name: hermie-web-state, mountPath: /data }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      volumes:
        - { name: hermes-data, persistentVolumeClaim: { claimName: hermes-data } }
        - { name: hermie-web-state, persistentVolumeClaim: { claimName: hermie-web-state } }
---
apiVersion: v1
kind: Service
metadata:
  name: hermie
spec:
  selector: { app: hermie }
  ports:
    - { name: http, port: 80, targetPort: 9120 }
  # The gateway's 9119 is deliberately not a port here: nothing outside the
  # Pod is meant to reach it directly, only through Hermie Web's proxy.
